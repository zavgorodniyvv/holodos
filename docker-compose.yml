# Docker log rotation; without it json logs grow until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: holodos
      POSTGRES_USER: holodos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holodos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: the backend reaches the DB over the compose network,
    # local tools (psql, mvn spring-boot:run) via 127.0.0.1. Never expose it publicly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holodos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    # Interface the UI is published on: localhost by default, the LAN address on the home server
    ports:
      - "${HOLODOS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/holodos
      SPRING_DATASOURCE_USERNAME: holodos
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-holodos}
      HOLODOS_MEDIA_PATH: /data/media
      HOLODOS_CORS_ALLOWED_ORIGINS: ${HOLODOS_CORS_ALLOWED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_TASKS_CLIENT_ID: ${GOOGLE_TASKS_CLIENT_ID:-}
      GOOGLE_TASKS_CLIENT_SECRET: ${GOOGLE_TASKS_CLIENT_SECRET:-}
      GOOGLE_TASKS_REDIRECT_URI: ${GOOGLE_TASKS_REDIRECT_URI:-}
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
