spring:
  application:
    name: holodos-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/holodos
    username: holodos
    password: holodos
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 500
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  task:
    scheduling:
      pool:
        size: 4
  cache:
    cache-names:
      - storage-places
      - units
      - categories
      - stores
      - products
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

holodos:
  # Household time zone: quiet hours for notifications are interpreted in it
  time-zone: ${HOLODOS_TIME_ZONE:Europe/Kyiv}
  security:
    allowed-emails:
      - zavgorodniy@gmail.com
      - podshybyakina@gmail.com
      - podshibyakina.elena1965@gmail.com
  cors:
    allowed-origins: "${HOLODOS_CORS_ALLOWED_ORIGINS:}"
  media:
    root-path: "${HOLODOS_MEDIA_PATH:${java.io.tmpdir}/holodos-media}"
    # To use MinIO (S3-compatible) instead of filesystem, uncomment:
    # provider: S3
    # s3:
    #   bucket: holodos-media
    #   access-key: holodos
    #   secret-key: holodos123
    #   region: us-east-1
    #   endpoint: http://localhost:9000
    #   path-style-access: true
  integrations:
    google-tasks:
      client-id: ${GOOGLE_TASKS_CLIENT_ID:}
      client-secret: ${GOOGLE_TASKS_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_TASKS_REDIRECT_URI:http://localhost:8080/api/integrations/google-tasks/oauth2/callback}
    # Guesses category/unit/place/shelf life for products added by name; disabled -> plain defaults
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-6-luna}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:none}
      timeout: 10s
